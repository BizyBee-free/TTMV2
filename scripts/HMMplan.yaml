🚀 Prompt Plan: VN30F HMM Trading BotObjective: Build a Python-based algorithmic trading system for VN30 Futures using Hidden Markov Models (HMM) to detect market regimes and predict state probabilities.1. Data Ingestion & ConfigurationData Source: Use a CSV file or an API (like vnstock or ccxt) providing 1 year of VN30 OHLCV data.Configuration (config.yaml):K_states: Default 3 (Configurable).Timeframe: Options [1D, 1H, 15m, 5m, 1m].Features: Log Returns, Intraday Range, Volume Change.Training_Iterations: 1000.2. Feature Engineering LogicTransform raw OHLCV into stationary features:$Log\_Returns = \ln(Close_t / Close_{t-1})$$Range = (High_t - Low_t) / Close_t$$Vol\_Change = (Vol_t - Vol_{t-1}) / Vol_{t-1}$Apply Z-score Normalization using a rolling window.3. HMM Model Core (using hmmlearn)Implement hmm.GaussianHMM from the hmmlearn library.Logic: Utilize the Baum-Welch (EM) algorithm via the .fit() method.E-step: Estimate the state responsibilities given current parameters.M-step: Update transition ($A$) and emission ($B$) matrices to maximize likelihood.Enable the model to output Current State Probabilities using predict_proba().4. Backtesting & Monte Carlo SimulationTrading Rule: Define a simple strategy (e.g., State 0 = Accumulation/Hold, State 1 = Bullish/Long, State 2 = Bearish/Short).Simulation: Run a backtest on the 1-year dataset.Output Requirement: Perform 10,000 samples (bootstrap or Monte Carlo) to calculate:Win/Lose Probability.Expectancy (Lợi nhuận kỳ vọng).Max Drawdown.5. Coding StandardsUse pandas, numpy, hmmlearn, and matplotlib.Code must be modular: data_loader.py, model.py, backtester.py, and main.py.Include a visualization script to color-code the VN30 price chart based on the 3 hidden states.